<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZenShaders Gallery</title>
<style>
  html, body {
    margin:0; padding:0;
    background:transparent;
    overflow:hidden;
    width:100%; height:100%;
  }

  .gallery {
    display:flex; flex-direction:column;
    gap:8px; padding:8px;
    width:100%; height:100%;
    box-sizing:border-box;
    opacity:0;
    transition:opacity 0.3s ease;
  }

  .gallery.ready { opacity:1; }

  .row { overflow:hidden; width:100%; flex:1; }

  .track {
    display:flex; width:max-content; height:100%;
    animation: scrollLeft 260s linear infinite;
    will-change: transform;
  }

  .row:nth-child(even) .track { animation-direction:reverse; }

  .track img {
    height:100%; width:auto;
    border-radius:8px; flex-shrink:0;
    object-fit:cover; display:block;
    margin:0 5px;
  }

  @keyframes scrollLeft {
    from { transform:translateX(0); }
    to   { transform:translateX(-50%); }
  }
</style>
</head>
<body>
<div class="gallery" id="gallery"></div>
<script>
  const rows = [
    { base: 'https://zenshaders.github.io/Pages/images/materials/', prefix: 'mat_'   },
    { base: 'https://zenshaders.github.io/Pages/images/decals/',    prefix: 'decal_' },
    { base: 'https://zenshaders.github.io/Pages/images/brushes/',   prefix: 'brush_' },
    { base: 'https://zenshaders.github.io/Pages/images/textures/',  prefix: 'text_'  },
    { base: 'https://zenshaders.github.io/Pages/images/dynamic/',   prefix: 'dyn_'   },
  ];
  const MAX = 200;

  function tryLoad(base, prefix, n) {
    return new Promise(resolve => {
      const img = document.createElement('img');
      img.onload  = () => resolve(img);
      img.onerror = () => {
        const other = document.createElement('img');
        other.onload  = () => resolve(other);
        other.onerror = () => resolve(null);
        other.src = base + prefix + n + (img.src.endsWith('.png') ? '.jpg' : '.png');
        other.alt = '';
      };
      img.src = base + prefix + n + '.png';
      img.alt = '';
    });
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  async function makeRow(base, prefix) {
    const row   = document.createElement('div');
    row.className = 'row';
    const track = document.createElement('div');
    track.className = 'track';

    const nums = shuffle(Array.from({length: MAX}, (_, i) => i + 1));
    const loaded = [];

    await Promise.all(nums.map(async n => {
      const img = await tryLoad(base, prefix, n);
      if (img) {
        img.style.height = '100%';
        img.style.width = 'auto';
        img.style.borderRadius = '8px';
        img.style.flexShrink = '0';
        img.style.objectFit = 'cover';
        img.style.display = 'block';
        img.style.margin = '0 5px';
        loaded.push({ n, img });
      }
    }));

    [...loaded, ...loaded].forEach(({ img }) => {
      track.appendChild(img.cloneNode());
    });

    // Velocidad proporcional: 3s por imagen para que todas vayan igual de rápido visualmente
    const duration = loaded.length * 3;
    track.style.animationDuration = duration + 's';

    row.appendChild(track);
    return row;
  }

  async function init() {
    const gallery = document.getElementById('gallery');

    // Construir todas las filas antes de mostrar nada
    const rowElements = await Promise.all(
      rows.map(r => makeRow(r.base, r.prefix))
    );

    rowElements.forEach(el => gallery.appendChild(el));

    // Mostrar todo de golpe con fade suave
    gallery.classList.add('ready');
  }

  init();
</script>
</body>
</html>
