<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZenShaders Gallery</title>
<style>
  html, body {
    margin:0; padding:0;
    background:transparent;
    overflow:hidden;
    width:100%; height:100%;
  }

  .gallery {
    display:flex; flex-direction:column;
    gap:8px; padding:8px;
    width:100%; height:100%;
    box-sizing:border-box;
  }

  .row { overflow:hidden; width:100%; flex:1; }

  .track {
    display:flex; width:max-content; height:100%;
    animation: scrollLeft 200s linear infinite;
    will-change: transform;
  }

  .row:nth-child(even) .track { animation-direction:reverse; }

  .track img {
    height:100%; width:auto;
    border-radius:8px; flex-shrink:0;
    object-fit:cover; display:block;
    margin:0 5px;
  }

  @keyframes scrollLeft {
    from { transform:translateX(0); }
    to   { transform:translateX(-50%); }
  }
</style>
</head>
<body>
<div class="gallery" id="gallery"></div>
<script>
  const BASE  = 'https://zenshaders.github.io/Pages/images/materials/';
  const TOTAL = 78;

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function makeRow(images) {
    const row   = document.createElement('div');
    row.className = 'row';
    const track = document.createElement('div');
    track.className = 'track';

    // Cargamos primero solo el primer set para medir cuáles cargan
    // Duplicamos exactamente para que -50% sea perfecto
    const doubled = [...images, ...images];
    doubled.forEach(n => {
      const img = document.createElement('img');
      img.src = BASE + 'mat_' + n + '.png';
      img.alt = '';
      // Ocultar imágenes rotas silenciosamente
      img.onerror = function() { this.style.display = 'none'; this.style.margin = '0'; };
      track.appendChild(img);
    });

    row.appendChild(track);
    return row;
  }

  const gallery = document.getElementById('gallery');
  const nums    = Array.from({length: TOTAL}, (_, i) => i + 1);

  for (let i = 0; i < 4; i++) {
    gallery.appendChild(makeRow(shuffle([...nums])));
  }
</script>
</body>
</html>
