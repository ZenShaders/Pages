<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZenShaders Gallery</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: #111111;
    overflow: hidden;
  }

  .gallery {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 10px 0;
    width: 100%;
  }

  .row {
    overflow: hidden;
    width: 100%;
  }

  .track {
    display: flex;
    gap: 10px;
    width: max-content;
    animation: scrollLeft 40s linear infinite;
  }

  .row:nth-child(even) .track {
    animation-direction: reverse;
  }

  .track img {
    height: 160px;
    width: auto;
    border-radius: 8px;
    flex-shrink: 0;
    object-fit: cover;
    display: block;
  }

  @keyframes scrollLeft {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
</style>
</head>
<body>
<div class="gallery" id="gallery"></div>

<script>
  const BASE = 'https://zenshaders.github.io/Pages/images/materials/';
  const TOTAL = 78;

  // Genera array [1..78] y lo baraja
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function makeRow(images) {
    const row = document.createElement('div');
    row.className = 'row';
    const track = document.createElement('div');
    track.className = 'track';

    // Duplicar para el loop infinito
    const doubled = [...images, ...images];
    doubled.forEach(n => {
      const img = document.createElement('img');
      img.src = BASE + 'mat_' + n + '.png';
      img.alt = '';
      track.appendChild(img);
    });

    row.appendChild(track);
    return row;
  }

  const gallery = document.getElementById('gallery');
  const nums = Array.from({length: TOTAL}, (_, i) => i + 1);

  // 4 filas con orden aleatorio independiente cada una
  for (let i = 0; i < 4; i++) {
    gallery.appendChild(makeRow(shuffle([...nums])));
  }
</script>
</body>
</html>
