<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZenShaders Gallery</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; width:100%; height:100%; }
  .gallery { display:flex; flex-direction:column; gap:8px; padding:8px; width:100%; height:100%; box-sizing:border-box; opacity:0; transition:opacity 0.3s ease; }
  .gallery.ready { opacity:1; }
  .row { overflow:hidden; width:100%; flex:1; padding:8px 0; box-sizing:border-box; }
  .track { display:flex; width:max-content; height:100%; animation: scrollLeft 260s linear infinite; will-change:transform; }
  .row:nth-child(even) .track { animation-direction:reverse; }
  .track img { height:100%; width:auto; border-radius:8px; flex-shrink:0; object-fit:cover; display:block; margin:0 5px; }
  @keyframes scrollLeft { from { transform:translateX(0); } to { transform:translateX(-50%); } }
</style>
</head>
<body>
<div class="gallery" id="gallery"></div>
<script>
  const categories = [
    { base: 'https://zenshaders.github.io/Pages/images/materials/' },
    { base: 'https://zenshaders.github.io/Pages/images/decals/' },
    { base: 'https://zenshaders.github.io/Pages/images/brushes/' },
    { base: 'https://zenshaders.github.io/Pages/images/textures/' },
    { base: 'https://zenshaders.github.io/Pages/images/dynamic_textures/' },
    { base: 'https://zenshaders.github.io/Pages/images/dynamic_decals/' },
  ];
  const ROWS = 4;

  function shuffle(arr) {
    for (let i = arr.length-1; i>0; i--) {
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  async function loadManifest(base) {
    try {
      const r = await fetch(base + 'manifest.json');
      return await r.json();
    } catch { return []; }
  }

  function makeImg(src) {
    const img = document.createElement('img');
    img.src = src;
    img.alt = '';
    img.style.margin = '0 5px';
    img.style.background = '#121212';
    img.style.borderRadius = '8px';
    img.onerror = function() { this.style.display='none'; this.style.margin='0'; };
    return img;
  }

  async function init() {
    const gallery = document.getElementById('gallery');

    // Cargar todos los manifests y construir lista completa de URLs
    const allUrls = [];
    await Promise.all(categories.map(async cat => {
      const files = await loadManifest(cat.base);
      files.forEach(f => allUrls.push(cat.base + f));
    }));

    // Crear 4 filas con orden aleatorio independiente
    for (let i = 0; i < ROWS; i++) {
      const shuffled = shuffle([...allUrls]);
      const row = document.createElement('div');
      row.className = 'row';
      const track = document.createElement('div');
      track.className = 'track';
      track.style.animationDuration = (shuffled.length * 3) + 's';

      [...shuffled, ...shuffled].forEach(url => track.appendChild(makeImg(url)));
      row.appendChild(track);
      gallery.appendChild(row);
    }

    gallery.classList.add('ready');
  }

  init();
</script>
</body>
</html>
