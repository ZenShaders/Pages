<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZenShaders - Render Slider</title>
<style>
  html, body {
    margin:0; padding:0;
    background:#000;
    overflow:hidden;
    width:100%; height:100%;
  }

  .slider {
    position:relative;
    width:100%; height:100%;
  }

  .slide {
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    opacity:0;
    transition:opacity 1.5s ease-in-out;
  }

  .slide img {
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }

  .slide.active { opacity:1; }
</style>
</head>
<body>
<div class="slider" id="slider"></div>
<script>
  const BASE   = 'https://zenshaders.github.io/Pages/images/fade_slider/';
  const PREFIX = 'slider_fade_';
  const MAX    = 50;
  const DELAY  = 4000;  // ms entre slides
  let current  = 0;

  function tryLoad(n) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload  = () => resolve(img);
      img.onerror = () => {
        const other = new Image();
        other.onload  = () => resolve(other);
        other.onerror = () => resolve(null);
        other.src = BASE + PREFIX + n + (img.src.endsWith('.png') ? '.jpg' : '.png');
      };
      img.src = BASE + PREFIX + n + '.png';
    });
  }

  async function init() {
    const slider = document.getElementById('slider');
    const slides = [];

    // Cargar todas las imágenes
    for (let n = 1; n <= MAX; n++) {
      const img = await tryLoad(n);
      if (!img) break; // para en el primer hueco
      const div = document.createElement('div');
      div.className = 'slide';
      div.appendChild(img);
      slider.appendChild(div);
      slides.push(div);
    }

    if (slides.length === 0) return;

    // Mostrar primera
    slides[0].classList.add('active');

    // Rotar
    setInterval(() => {
      slides[current].classList.remove('active');
      current = (current + 1) % slides.length;
      slides[current].classList.add('active');
    }, DELAY);
  }

  init();
</script>
</body>
</html>
