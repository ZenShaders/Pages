<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZenShaders - decals Row</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; width:100%; height:100%; }
  .row { overflow:hidden; width:100%; height:100%; }
  .track { display:flex; width:max-content; height:100%; animation: scrollLeft 180s linear infinite; will-change:transform; }
  .track img { height:100%; width:auto; border-radius:8px; flex-shrink:0; object-fit:cover; display:block; margin:0 5px; }
  @keyframes scrollLeft { from { transform:translateX(0); } to { transform:translateX(-50%); } }
</style>
</head>
<body>
<div class="row"><div class="track" id="track"></div></div>
<script>
  const BASE='https://zenshaders.github.io/Pages/images/decals/', PREFIX='decal_', MAX=200;
  function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
  function tryLoad(n){return new Promise(resolve=>{const img=document.createElement('img');img.onload=()=>resolve(img);img.onerror=()=>{const other=document.createElement('img');other.onload=()=>resolve(other);other.onerror=()=>resolve(null);other.src=BASE+PREFIX+n+(img.src.endsWith('.png')?'.jpg':'.png');other.alt='';}; img.src=BASE+PREFIX+n+'.png';img.alt='';}); }
  async function init(){const track=document.getElementById('track');const nums=shuffle(Array.from({length:MAX},(_,i)=>i+1));const loaded=[];await Promise.all(nums.map(async n=>{const img=await tryLoad(n);if(img)loaded.push(img);}));[...loaded,...loaded].forEach(img=>{const clone=img.cloneNode();clone.style.margin='0 5px';track.appendChild(clone);});track.style.animationDuration=(loaded.length*3)+'s';}
  init();
</script>
</body>
</html>
