<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZenShaders Row</title>
<style>
  html, body { margin:0; padding:0; background:#282828; overflow:hidden; width:100%; height:100%; }
  .row { overflow:hidden; width:100%; height:100%; }
  .track { display:flex; width:max-content; height:100%; animation: scrollLeft 180s linear infinite; will-change:transform; }
  .track img { height:100%; width:auto; border-radius:8px; flex-shrink:0; object-fit:cover; display:block; margin:0 5px; }
  @keyframes scrollLeft { from { transform:translateX(0); } to { transform:translateX(-50%); } }
</style>
</head>
<body>
<div class="row"><div class="track" id="track"></div></div>
<script>
  const BASE = 'https://zenshaders.github.io/Pages/images/dynamic_decals/';
  const MIN_IMAGES = 20;
  const USE_SHUFFLE = false;


  function noAdjacentDupes(arr) {
    // Si hay pocas imágenes únicas, no intentar deduplicar
    const unique = new Set(arr).size;
    if (unique < 5) return arr;
    for (let i = 1; i < arr.length - 1; i++) {
      if (arr[i] === arr[i-1]) {
        // Buscar posición de swap donde no cree otro duplicado adyacente
        for (let j = i+2; j < arr.length; j++) {
          if (arr[j] !== arr[i-1] && arr[j] !== arr[i+1 < arr.length ? i+1 : 0]) {
            [arr[i], arr[j]] = [arr[j], arr[i]];
            break;
          }
        }
      }
    }
    return arr;
  }


  function shuffle(arr) {
    for (let i=arr.length-1; i>0; i--) {
      const j=Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  async function loadManifest() {
    try { const r = await fetch(BASE + 'manifest.json'); return await r.json(); }
    catch { return []; }
  }

  async function init() {
    const track = document.getElementById('track');
    let files = await loadManifest();
    if (!files.length) return;

    if (USE_SHUFFLE) {
      files = shuffle(files);
      files = noAdjacentDupes(files);
    }

    while (files.length < MIN_IMAGES) files = [...files, ...files];
    if (USE_SHUFFLE) files = noAdjacentDupes(files);

    [...files, ...files].forEach(f => {
      const img = document.createElement('img');
      img.src = BASE + f;
      img.alt = '';
      img.style.margin = '0 5px';
      img.onerror = function() { this.style.display='none'; this.style.margin='0'; };
      track.appendChild(img);
    });

    track.style.animationDuration = (files.length * 3) + 's';
  }

  init();
</script>
</body>
</html>
